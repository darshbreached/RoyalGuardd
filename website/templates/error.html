{% extends "base.html" %}
{% block title %}Error — Darsh Industries{% endblock %}
{% block content %}
<style>
  .wrap{display:flex;flex-direction:column;align-items:center;font-family:'Inter',sans-serif;text-align:center;}

  .ring-wrap{position:relative;width:84px;height:84px;opacity:0;transform:scale(.7);animation:ring-in .5s cubic-bezier(.25,.8,.3,1.15) .05s forwards;}
  .ring{width:100%;height:100%;border-radius:50%;border:2px solid #C4453D;display:flex;align-items:center;justify-content:center;}
  .ring svg{width:32px;height:32px;stroke:#C4453D;}
  @keyframes ring-in{0%{opacity:0;transform:scale(.7);}70%{opacity:1;transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}

  h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:20px;color:#F2F4F7;margin:22px 0 10px;opacity:0;animation:fade-up .35s ease-out .35s forwards;}
  .message{font-size:13.5px;color:#8B93A3;max-width:360px;line-height:1.6;opacity:0;animation:fade-up .35s ease-out .5s forwards;}

  .retry{
    display:inline-block;margin-top:26px;background:#D7DEE8;color:#14161B;font-family:'Inter',sans-serif;
    font-weight:600;font-size:13.5px;text-decoration:none;padding:11px 22px;border-radius:6px;
    transition:background .15s ease;opacity:0;animation:fade-up .35s ease-out .65s forwards;
  }
  .retry:hover{background:#EAF0F8;}

  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (prefers-reduced-motion:reduce){.ring-wrap,h1,.message,.retry{opacity:1!important;transform:none!important;animation:none!important;}}
</style>

<div class="wrap">
  <div class="ring-wrap">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
  </div>
  <h1>That didn't work</h1>
  <div class="message">{{ message }}</div>
  <a class="retry" href="/">Return to Darsh Industries</a>
</div>
{% endblock %}
