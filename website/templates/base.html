<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Verification{% endblock %}</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #1C1F26;
      --border: rgba(215, 222, 232, 0.10);
      --text: #F2F4F7;
      --text-dim: #8B93A3;
      --glass: #D7DEE8;
      --glow: #8FA6C9;
      --success: #5EA37A;
      --error: #C4453D;
    }
    * { box-sizing: border-box; }
    body {
      background: #000000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    footer {
      text-align: center;
      padding: 20px 24px 28px;
      font-size: 12px;
      color: var(--text-dim);
    }
    footer a { color: var(--text-dim); text-decoration: none; margin: 0 10px; }
    footer a:hover { color: var(--text); text-decoration: underline; }

    a { color: var(--glass); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px 32px;
    }
    .badge {
      display: inline-block;
      background: rgba(143, 166, 201, 0.10);
      color: var(--glass);
      border: 1px solid rgba(143, 166, 201, 0.25);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </footer>
</body>
</html>
