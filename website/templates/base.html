<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Darsh Industries{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14161B;
      --panel: #1C1F26;
      --border: rgba(215, 222, 232, 0.10);
      --text: #F2F4F7;
      --text-dim: #8B93A3;
      --glass: #D7DEE8;
      --glow: #8FA6C9;
      --success: #5EA37A;
      --error: #C4453D;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 700px 400px at 50% -5%, rgba(143,166,201,0.10), transparent 65%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 28px 24px 0;
    }
    header img {
      width: 32px;
      height: 32px;
      min-width: 32px;
      max-width: 32px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    header .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
    }
    header .wordmark span {
      color: var(--text-dim);
      font-weight: 400;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    footer {
      text-align: center;
      padding: 20px 24px 28px;
      font-size: 11.5px;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      opacity: 0.7;
    }

    a { color: var(--glass); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px 32px;
    }
    .badge {
      display: inline-block;
      background: rgba(143, 166, 201, 0.10);
      color: var(--glass);
      border: 1px solid rgba(143, 166, 201, 0.25);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Darsh Industries" width="32" height="32">
    <div class="wordmark">Darsh <span>Industries</span></div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Darsh Industries — Bot Hosting</footer>
</body>
</html>
