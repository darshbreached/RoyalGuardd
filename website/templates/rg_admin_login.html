{% extends "rg_base.html" %}
{% block title %}Admin | Royal Guard{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="{{ url_for('static', filename='css/rg-dash.css') }}">{% endblock %}
{% block content %}
<div class="dwrap" style="max-width:460px">
  <div class="kicker"><i></i>Owner access</div>
  <h1>Admin</h1>
  {% if error %}<p class="sub" style="color:#ff8a80">{{ error }}</p>{% endif %}
  <form method="post" class="frame cpanel" style="margin-top:20px">
    <label class="lbl" for="pw">Password</label>
    <input class="dsearch" style="max-width:none;margin-bottom:18px" type="password" id="pw" name="password" autocomplete="current-password" autofocus>
    <button class="rg-btn" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
