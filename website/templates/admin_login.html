{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<style>
  .adm { width: 100%; max-width: 420px; }
  .adm h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 1.4rem; margin: 0 0 18px; }
  .adm label { display: block; font-size: .8rem; color: var(--text-dim); margin: 0 0 6px; }
  .adm input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 11px 12px; color: var(--text); font: inherit; margin-bottom: 16px; }
  .adm button { background: var(--glass); color: #14161B; border: 0; border-radius: 6px; padding: 10px 18px; font: 600 .9rem 'Inter', sans-serif; cursor: pointer; }
  .adm .bad { color: var(--error); font-size: .9rem; margin: 0 0 14px; }
</style>
<div class="panel adm">
  <h1>Admin</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
