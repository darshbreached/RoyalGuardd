{% extends "base.html" %}
{% block title %}Verified — Darsh Industries{% endblock %}
{% block content %}
<style>
  .wrap{display:flex;flex-direction:column;align-items:center;font-family:'Inter',sans-serif;text-align:center;}

  .ring-wrap{position:relative;width:84px;height:84px;opacity:0;transform:scale(.7);animation:ring-in .5s cubic-bezier(.25,.8,.3,1.15) .05s forwards;}
  .ring{width:100%;height:100%;border-radius:50%;border:2px solid #5EA37A;display:flex;align-items:center;justify-content:center;}
  .ring svg{width:34px;height:34px;stroke:#5EA37A;}
  .pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid #5EA37A;opacity:0;animation:pulse-out .6s ease-out .45s forwards;}
  @keyframes ring-in{0%{opacity:0;transform:scale(.7);}70%{opacity:1;transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}
  @keyframes pulse-out{0%{opacity:.8;transform:scale(.9);}100%{opacity:0;transform:scale(1.4);}}

  h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;color:#F2F4F7;margin:22px 0 10px;opacity:0;animation:fade-up .35s ease-out .5s forwards;}
  .subtitle{font-size:13.5px;color:#8B93A3;max-width:360px;line-height:1.6;opacity:0;animation:fade-up .35s ease-out .68s forwards;}
  .subtitle strong{color:#F2F4F7;}

  .instructions{
    margin-top:22px;font-size:12.5px;color:#8B93A3;max-width:340px;line-height:1.6;
    padding:12px 16px;background:rgba(143,166,201,0.06);border:1px solid rgba(143,166,201,0.16);border-radius:6px;
    opacity:0;animation:fade-up .35s ease-out .85s forwards;
  }
  .instructions code{color:#D7DEE8;font-family:'Space Grotesk',monospace;}

  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.ring-wrap,h1,.subtitle,.instructions{opacity:1!important;transform:none!important;animation:none!important;}.pulse{display:none;}}
</style>

<div class="wrap">
  <div class="ring-wrap">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 12 9 17 20 6"></polyline>
      </svg>
    </div>
    <div class="pulse"></div>
  </div>
  <h1>Verified</h1>
  <div class="subtitle">Roblox account <strong>{{ roblox_username }}</strong> is linked.</div>
  <div class="instructions">Close this tab and go back to Discord. Run <code>/update</code> or press <strong>Update Roles</strong> to sync.</div>
</div>
{% endblock %}
